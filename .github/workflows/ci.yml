name: CI

# push（全ブランチ）とPRで、型チェック・テスト・本番ビルドを回すゲート。
# 落ちたらマージ不可にできる（GitHub のブランチ保護で必須チェックに指定）。

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # バージョンはここに直接書かず .nvmrc を唯一の正とする。
          # 開発環境と CI の食い違いを防ぐため、上げるときは .nvmrc だけ書き換える。
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # ビルドは実接続を要しない（ページは force-dynamic）。CI用のダミー値を渡す。
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
