name: CI

# push（全ブランチ）とPRで、型チェック・テスト・本番ビルドを回すゲート。
# 落ちたらマージ不可にできる（GitHub のブランチ保護で必須チェックに指定）。

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # timeout-minutes はランナー待ちの時間も含めて数えられる。
    # 15分だとランナーが逼迫した日にキュー待ちのままキャンセルされる
    # （2026-08-06 に main の実行が runner 未割当のまま15分で落ちた）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # バージョンはここに直接書かず .nvmrc を唯一の正とする。
          # 開発環境と CI の食い違いを防ぐため、上げるときは .nvmrc だけ書き換える。
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # ダミー値は package.json の build:ci に持たせ、CI と手元で同じコマンドを叩けるようにする。
      # （素の `npm run build` は Supabase の変数が無いとプリレンダリングで落ちる）
      - name: Production build
        run: npm run build:ci
